[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moneyness"
version = "0.1.0"
description = "Options pricing, Greeks and implied volatility, validated against closed-form results."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
moneyness = "moneyness.cli:main"

[project.optional-dependencies]
# mpmath is a test dependency, not a runtime one. The library itself has no
# dependencies at all; the tests use mpmath to evaluate the same mathematics at
# fifty decimal digits, independently of the double-precision code under test.
# Without it the suite does not collect.
dev = ["pytest>=8", "mypy>=1.8", "ruff>=0.4", "mpmath>=1.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = "mpmath.*"
ignore_missing_imports = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
