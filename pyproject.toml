[build-system]
# 77 is the floor for the SPDX `license` expression and `license-files` below.
# Anything older reads `license = "MIT"` as a legacy table and fails the build.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "moneyness"
version = "0.1.0"
description = "Options pricing, Greeks and implied volatility, validated against closed-form results."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Daniyal" }]
keywords = [
    "options",
    "black-scholes",
    "greeks",
    "implied-volatility",
    "volatility-surface",
    "svi",
    "american-options",
    "quantitative-finance",
]
# No `License ::` classifier: it is mutually exclusive with the SPDX expression
# above, and supplying both is an error rather than a duplication.
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/DaniyalMlk/moneyness"
Source = "https://github.com/DaniyalMlk/moneyness"
Issues = "https://github.com/DaniyalMlk/moneyness/issues"

[project.scripts]
moneyness = "moneyness.cli:main"

[project.optional-dependencies]
# mpmath is a test dependency, not a runtime one. The library itself has no
# dependencies at all; the tests use mpmath to evaluate the same mathematics at
# fifty decimal digits, independently of the double-precision code under test.
# Without it the suite does not collect.
dev = ["pytest>=8", "mypy>=1.8", "ruff>=0.4", "mpmath>=1.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = "mpmath.*"
ignore_missing_imports = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
